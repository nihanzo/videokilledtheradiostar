<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nihanzo — kissen 3d</title>
  <!-- ============================================================
       NEUE SZENE (Experiment): Lamellen-Kissen als GLB (three.js)
       Ziel: die einzelnen Lamellen in der Mitte per Cursor detailliert
       zur Seite schieben (nur Lamellen, nicht der äußere Kissenrand).
       Schritt 1: GLB laden, top-down rendern, Struktur ausgeben.
       ============================================================ -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #F4F4E1; overflow: hidden; }
    body { cursor: none; }
    #app { position: fixed; inset: 0; }
    #cursor{
      position: fixed; left: 0; top: 0; width: 40px; z-index: 9999; pointer-events: none;
      transform: translate(-200px,-200px); will-change: transform; opacity: .95;
    }
    #cursor img{ width: 100%; height: auto; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
    #hud{
      position: fixed; left: 10px; bottom: 10px; z-index: 5; font: 12px/1.4 system-ui, sans-serif;
      color: #7a8069; background: rgba(255,255,255,.5); padding: 6px 9px; border-radius: 6px; max-width: 46ch;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="cursor"><img src="assets/img/plane-icon.svg" alt=""></div>
  <div id="hud">lädt GLB …</div>

  <script type="importmap">
  { "imports": { "three": "./js/vendor/three/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './js/vendor/three/GLTFLoader.js';

    const app = document.getElementById('app');
    const hud = document.getElementById('hud');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa488, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(0.6, 1, 0.4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffe9d6, 0.7); rim.position.set(-0.5, 0.7, -0.6); scene.add(rim);

    let camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100000);
    let sxDim = 1, syDim = 1;   // in-plane Maße für Cover-Fit (früh deklariert)

    // ---- Interaktion: innere Lamellen weichen dem Cursor aus ----
    let lamellae = [], cushionPlane = null, mixer = null;
    const clock = new THREE.Clock();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(-2, -2);
    const PUSH = { radius: 0.44, maxPush: 0.07, lerp: 0.15 };   // tangential; live justierbar via window.__PUSH (dezenter)
    window.__PUSH = PUSH;
    function ss(e0, e1, x){ const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t*t*(3-2*t); }
    addEventListener('mousemove', e => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
    });
    const _hit = new THREE.Vector3(), _dir = new THREE.Vector3(), _tmp = new THREE.Vector3(), _tgt = new THREE.Vector3();
    function updateParts(){
      if (!lamellae.length || !cushionPlane) return;
      raycaster.setFromCamera(pointer, camera);
      const ok = pointer.x >= -1 && raycaster.ray.intersectPlane(cushionPlane, _hit);
      for (const L of lamellae){
        if (ok){
          _dir.copy(L.centroid).sub(_hit); _dir.setComponent(window.__thinAxis, 0);  // Cursor -> Lamelle, in der Ebene
          const dist = _dir.length();
          const fall = ss(PUSH.radius, 0, dist);            // 1 nah am Cursor -> 0 weit weg
          const side = Math.sign(_dir.dot(L.tangent)) || 1; // welche Seite des Cursors
          _tgt.copy(L.tangent).multiplyScalar(side * PUSH.maxPush * fall);  // tangential auffächern
        } else _tgt.set(0, 0, 0);
        L.curOffset.lerp(_tgt, PUSH.lerp);               // weich nachziehen
        _tmp.copy(L.baseWorld).add(L.curOffset);
        L.obj.parent.worldToLocal(_tmp);
        L.obj.position.copy(_tmp);
      }
    }

    const loader = new GLTFLoader();
    loader.load('./assets/models/kissen.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // --- Struktur inspizieren ---
      const parts = [];
      model.traverse(o => {
        if (o.isMesh) {
          const g = o.geometry;
          let col = '';
          try { col = o.material && o.material.color ? o.material.color.getHexString() : ''; } catch(e){}
          parts.push({ name: o.name, verts: g.attributes.position.count,
                       mat: o.material && o.material.name, color: col });
        }
      });
      window.__parts = parts; window.__model = model;
      window.__anims = gltf.animations || [];
      console.log('MESH_COUNT', parts.length);
      console.log('ANIMS', JSON.stringify((gltf.animations||[]).map(a => ({ name:a.name, dur:+a.duration.toFixed(3), tracks:a.tracks.length }))));

      // --- Kamera top-down auf die dünnste Achse ausrichten ---
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3(); box.getSize(size);
      const center = new THREE.Vector3(); box.getCenter(center);
      const a = [size.x, size.y, size.z];
      const thin = a.indexOf(Math.min(a[0], a[1], a[2]));
      const dirV = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)][thin];
      window.__thinAxis = thin;
      // in-plane Maße auf Screen-X / Screen-Y abbilden (für Cover-Fit)
      if (thin === 2){ sxDim = size.x; syDim = size.y; }
      else if (thin === 0){ sxDim = size.z; syDim = size.y; }
      else { sxDim = size.x; syDim = size.z; }
      const dist = Math.max(a[0], a[1], a[2]) * 4 + 1;
      camera.position.copy(center).addScaledVector(dirV, dist);
      camera.up.copy(thin === 1 ? new THREE.Vector3(0,0,-1) : new THREE.Vector3(0,1,0));
      camera.lookAt(center);
      applyOrtho();
      window.__center = center;

      // Lamellen sammeln: Basis-Weltposition, Schwerpunkt, Tangentenrichtung (für Auffächern)
      model.updateMatrixWorld(true);
      const axisN = new THREE.Vector3(); axisN.setComponent(thin, 1);
      lamellae = [];
      model.traverse(o => {
        if (o.isMesh && /^Lamelle/.test(o.name)){
          o.geometry.computeBoundingBox();
          const bb = o.geometry.boundingBox.clone(); bb.applyMatrix4(o.matrixWorld);
          const centroid = new THREE.Vector3((bb.min.x+bb.max.x)/2, (bb.min.y+bb.max.y)/2, (bb.min.z+bb.max.z)/2);
          const baseWorld = o.getWorldPosition(new THREE.Vector3());
          // radiale Richtung vom Zentrum + Tangente (senkrecht dazu in der Kissen-Ebene)
          const radial = centroid.clone().sub(center); radial.setComponent(thin, 0); radial.normalize();
          const tangent = new THREE.Vector3().crossVectors(axisN, radial).normalize();
          lamellae.push({ obj: o, baseWorld, centroid, tangent, curOffset: new THREE.Vector3() });
        }
      });
      const pn = new THREE.Vector3(); pn.setComponent(thin, 1);
      cushionPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(pn, center);

      // GLB-Animation abspielen (die äußeren Luftkissen "leben")
      mixer = new THREE.AnimationMixer(model);
      (gltf.animations || []).forEach(clip => mixer.clipAction(clip).play());

      hud.textContent = `GLB ok · ${lamellae.length} Lamellen tangential · ${(gltf.animations||[]).length} Anim-Clips laufen`;
    },
    (p) => { if (p.total) hud.textContent = `lädt GLB … ${Math.round(p.loaded/p.total*100)}%`; },
    (err) => { hud.textContent = 'GLB-Fehler: ' + err; console.error(err); });

    function applyOrtho(){
      const asp = innerWidth / innerHeight;
      const vHalf = Math.min(syDim / 2, sxDim / (2 * asp));   // Cover: füllt den ganzen Viewport
      camera.left = -vHalf * asp; camera.right = vHalf * asp;
      camera.top = vHalf; camera.bottom = -vHalf;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); applyOrtho(); });

    // Flugzeug-Cursor
    (function planeCursor(){
      const cursor = document.getElementById('cursor');
      let mx = innerWidth/2, my = innerHeight/2, lx = mx, ly = my, angle = 180;
      const NOSE0 = 225;
      addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
      (function f(){
        const vx = mx-lx, vy = my-ly, sp = Math.hypot(vx,vy); lx=mx; ly=my;
        if (sp > 1.1){ const t = Math.atan2(vy,vx)*180/Math.PI - NOSE0; let d=((t-angle+540)%360)-180; angle += d*0.18; }
        cursor.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%) rotate(${angle}deg)`;
        requestAnimationFrame(f);
      })();
    })();

    (function render(){ const dt = clock.getDelta(); if (mixer) mixer.update(dt); updateParts(); renderer.render(scene, camera); requestAnimationFrame(render); })();
  </script>
</body>
</html>
