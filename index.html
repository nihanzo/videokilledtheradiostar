<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Schrift: eigene „Nihanzo Grotesk“ (assets/fonts/nihanzo, nach dem Stil des Musterbilds gezeichnet: sehr fett,
     weiche Ecken, enge Laufweite; nur Kleinbuchstaben, Ziffern und Satzzeichen – Großbuchstaben zeigen die Kleinbuchstaben) -->
<link rel="icon" href="data:," />   <!-- kein favicon.ico-Abruf (sonst 404) -->
<link rel="preload" href="assets/fonts/nihanzo/NihanzoGrotesk.ttf?v=4" as="font" type="font/ttf" crossorigin />
<title>nihanzo</title>
<!-- Schrift des SCROLL-Rahmens (Vorhang der Startseite) schon hier holen: dann liegt sie im Cache, wenn der Vorhang erscheint.
     LOKAL (Turret Road 300, latin, OFL) statt Google Fonts -> keine IP-Übermittlung an Google (DSGVO) -->
<link rel="preload" href="assets/fonts/turret-road/TurretRoad-Light-latin.woff2" as="font" type="font/woff2" crossorigin />
<script src="js/device.js"></script>   <!-- NIH_PAGE = startpage.html oder startpage-mobile.html (Handy) -->
<!--
  LADESEITE – weißer Hintergrund, nur drei Dinge:
   1. Silberne Powerbank (reines CSS nach Produktfoto, hochkant), mittig im oberen Drittel, lädt 0 -> 100 %
      (= echter Ladestand der Startseite, mindestens DURATION lang).
   2. Schwarzes, geflochtenes USB-C-Kabel (SVG, Stecker nach Foto-Vorlage) wächst WÄHREND des Ladens aus dem linken Port (USB-C-Buchse) nach unten; der Stecker sitzt an
      der Spitze und steckt bei 100 % von oben mittig in den Sound-Buttons (Metallspitze verschwindet unter der Button-Kante).
   3. Sound-Buttons mittig weiter unten: während des Ladens blass und nicht klickbar; sobald das Kabel ankommt, bekommen sie
      die Rosenfarbe und rundherum (auch unten) geht ein schwarzes Feuerwerk los (kurze Raketen nach außen, zerplatzen schnell, die Funken sinken
      danach zu Boden, gleiten dort aus und verglühen erst dann; nur außerhalb der Buttons).
-->
<style>
  @font-face{ font-family:'Nihanzo Grotesk'; src:url('assets/fonts/nihanzo/NihanzoGrotesk.ttf?v=4') format('truetype');
    font-weight:100 900; font-display:swap; }   /* eine Stärke für alle Gewichte -> kein künstliches Fettmachen */
  :root{ --rose:#7A3524; --say:#6F798F; --font:'Nihanzo Grotesk',system-ui,sans-serif; }   /* --say = Farbe aller Schrift */
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overscroll-behavior:none; }   /* kein Gummiband am Seitenrand (Mac-Trackpad: Seite rutscht sonst kurz mit), kein Wischen zur vorigen Seite */
  body{ background:#fff; overflow:hidden; font-family:var(--font); font-weight:800; text-transform:lowercase; }   /* alles klein */

  #fx{ position:fixed; inset:0; width:100%; height:100%; z-index:9; pointer-events:none; }   /* Feuerwerk */
  /* Erscheinen: alles unsichtbar, bis die Schrift da ist (sonst springen Knopf-Texte und Kabel beim Schrift-Tausch), dann weich einblenden */
  .pb, .enter, .cable{ transition:opacity .45s ease; }
  body.boot .pb, body.boot .enter, body.boot .cable{ opacity:0; }

  /* USB-C-Kabel (z4): Powerbank (z7) und Buttons (z7) decken die Metallspitzen ab -> Stecker wirken eingesteckt */
  .cable{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:4; }
  .cable .c0{ fill:none; stroke:#141416; stroke-linecap:butt; stroke-linejoin:round; }   /* gerade Enden (stecken im Hals) */
  .cable .cbraid{ fill:none; stroke:#3b3b42; stroke-width:.75px; stroke-linecap:round; opacity:.9; }   /* Flechtmuster */
  .cable .c1{ fill:none; stroke:#77777e; stroke-linecap:butt; stroke-linejoin:round; opacity:.35; }   /* Glanzlinie (Rundung) */
  .cable--top{ z-index:8; }                                    /* Stecker oben liegt vor der Powerbank */
  .plug{ opacity:0; }

  /* Sound-Buttons: mittig weiter unten, größer; blass bis das Kabel ankommt (.ready), dann Rand/Hover in der Rosenfarbe */
  .enter{ position:fixed; z-index:7; display:flex; }
  .enter button{ flex:1 1 50%; min-width:0; font-family:var(--font); font-weight:inherit; font-size:inherit; letter-spacing:.03em;
    text-transform:lowercase; white-space:nowrap; color:#c2c4c9; background:#fff; border:2.6px solid #dadbd6;
    padding:.95em 1em; pointer-events:none; transition:background .25s ease, color .6s ease, border-color .6s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; line-height:1.1; }
  .enter button + button{ border-left:0; }                       /* kein Platz dazwischen, keine doppelte Linie */
  .enter button small{ font-size:.8em; opacity:.85; }
  .enter.ready button{ color:var(--say); border-color:var(--rose); pointer-events:auto; cursor:pointer; }   /* Farbe der Rosen (Startseite rechts) */
  .enter.ready button:hover, .enter.ready button:focus-visible{ background:var(--rose); color:#fff; outline:none; }

  /* Powerbank (SILBER, hochkant) – nach Produktfoto: Riffelung in dunklerem Silber, glattes Band unten mit
     rundem schwarzem Display, Ports an der Unterkante; Dicke = gestufte Kante nach unten rechts */
  .pb{ position:fixed; left:0; top:0; z-index:7; width:84px; height:137px; border-radius:17px;
    transform:scale(var(--pbs,1.25)); transform-origin:0 0;   /* größer (Grundmaße 84×137 bleiben, JS rechnet mit PBS) */
    background:
      linear-gradient(142deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 100%),
      repeating-linear-gradient(118deg,#d9dcdf 0 1.3px,#b3b8bd 1.3px 3px);
    box-shadow:
      inset 0 0 0 1px rgba(90,96,102,.28), inset 1px 1px 0 rgba(255,255,255,.8),
      1px 1px 0 #b1b5ba, 2px 2px 0 #9fa4a9, 3px 3px 0 #8d9297,
      12px 14px 18px rgba(40,46,52,.16); }
  .pb__band{ position:absolute; left:0; right:0; bottom:0; height:36%; border-radius:0 0 17px 17px;
    background:linear-gradient(180deg,#e4e6e9,#cfd3d7 55%,#dadde0);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 2px 0 rgba(120,126,132,.18), inset 0 -1px 0 rgba(255,255,255,.6); }
  .pb__disp{ position:absolute; left:50%; top:50%; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#2a2a2e 0%,#060607 55%);
    box-shadow:0 0 0 1.5px #8f949a, 0 0 0 2.5px #e9ebed, inset 0 1px 1px rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    font:800 12px/1 var(--font); color:#fff; letter-spacing:-.4px;   /* Prozentanzeige weiß */
    font-variant-numeric:tabular-nums; text-shadow:0 0 3px rgba(255,255,255,.45); }
  .pb__disp::before{ content:''; position:absolute; left:4.5px; top:50%; width:3px; height:3px; margin-top:-1.5px;
    border-radius:50%; background:#3ddc6a; box-shadow:0 0 4px #3ddc6a; }
  .pb__disp small{ position:absolute; right:4.5px; top:9px; font-size:5.5px; opacity:.85; }
  .pb.charging .pb__disp::before{ animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:.15; } }
  .pb__ports{ position:absolute; left:0; right:0; top:100%; height:3px; transform:skewX(45deg); transform-origin:0 0; }
  .pb__ports i{ position:absolute; top:.6px; height:1.8px; border-radius:1px; background:#2a2c2f;
    box-shadow:inset 0 0 0 .6px #6d7176; }
  .pb__ports i:nth-child(1){ left:18%; width:10px; height:2.2px; top:.4px; border-radius:1.1px; background:#0d0d0f;   /* USB-C: abgerundet */
    box-shadow:inset 0 0 0 .5px #6d7176; }
  .pb__ports i:nth-child(1)::after{ content:''; position:absolute; left:22%; right:22%; top:50%; height:.6px; margin-top:-.3px;
    border-radius:.3px; background:#9aa0a6; }   /* Kontaktzunge in der Mitte */
  .pb__ports i:nth-child(2){ left:40%; width:13px; background:#e8891f; box-shadow:inset 0 0 0 .6px #7a3f05; }
  .pb__ports i:nth-child(3){ left:66%; width:10px; }
</style>
</head>
<body class="boot">
  <canvas id="fx"></canvas>

  <svg class="cable" id="cable" aria-hidden="true">
    <defs>
      <!-- USB-C-Stecker nach Foto-Vorlage des Users (geflochtenes Kabel; Marken-Logo bewusst weggelassen). Einheit u, Ursprung =
           Übergang Kabel/Hals, +y zeigt zur Steckerspitze: Hals 0–10.4 (6u, weitet sich zum Gehäuse), Gehäuse 10.2–28.1 (12 breit,
           matt schwarz, Ecken nur leicht gerundet), helle Kante am Übergang, Metallhülse 28–35.6 (8.8 breit, silber-beige, fast eckig) -->
      <linearGradient id="plugBody" x1="0" x2="1"><stop offset="0" stop-color="#2b2b2f"/><stop offset=".16" stop-color="#151517"/>
        <stop offset=".55" stop-color="#0e0e10"/><stop offset=".88" stop-color="#151517"/><stop offset="1" stop-color="#26262a"/></linearGradient>
      <linearGradient id="plugShell" x1="0" x2="1"><stop offset="0" stop-color="#a39f96"/><stop offset=".2" stop-color="#d6d3cb"/>
        <stop offset=".45" stop-color="#f2f0eb"/><stop offset=".72" stop-color="#d1cec5"/><stop offset="1" stop-color="#9b988f"/></linearGradient>
      <g id="usbc">
        <path d="M-3 -0.6 H3 V5.2 C3 7.9 3.7 9.3 4.9 10.4 H-4.9 C-3.7 9.3 -3 7.9 -3 5.2 Z" fill="url(#plugBody)"/>
        <path d="M-4.5 10.2 H4.5 Q6 10.2 6 11.7 V27 Q6 28.1 4.9 28.1 H-4.9 Q-6 28.1 -6 27 V11.7 Q-6 10.2 -4.5 10.2 Z" fill="url(#plugBody)"/>
        <rect x="-5.1" y="9.85" width="10.2" height=".6" rx=".3" fill="#3a3a3f"/>
        <rect x="-4.4" y="28" width="8.8" height="7.6" rx=".35" fill="url(#plugShell)"/>
        <rect x="-4.4" y="28" width="8.8" height=".5" fill="#8f8c84" opacity=".7"/>
      </g>
    </defs>
    <g id="cabPath"><path class="c0"/><path class="cbraid" id="braid"/><path class="c1"/></g>
    <!-- Stecker unten: wandert an der Kabelspitze mit (Ursprung = Kabelende, Spitze zeigt in Wachstumsrichtung) -->
    <use class="plug" id="plugEnd" href="#usbc"/>
  </svg>
  <!-- Stecker oben: eigene Ebene ÜBER der Powerbank (z8), in ihren Grundmaßen (84×137, skaliert wie sie): derselbe Stecker
       umgedreht, Metallhülse steckt in der USB-C-Buchse (oberhalb der Buchsenmitte weggeschnitten), Gehäuse bündig darunter -->
  <svg class="cable cable--top" aria-hidden="true">
    <defs><clipPath id="portClip"><rect x="-20" y="138.4" width="124" height="120"/></clipPath></defs>
    <g class="plug" id="plugTop" clip-path="url(#portClip)"><use href="#usbc" transform="translate(20.8 165.8) rotate(180) scale(.9)"/></g>
  </svg>

  <div class="enter" id="enter">
    <button type="button" data-sound="on"><span>&#9654;&nbsp; enter with sound</span><small>(recommend)</small></button>
    <button type="button" data-sound="off"><span>enter without sound</span></button>
  </div>

  <div class="pb charging" id="pb" role="progressbar" aria-label="lädt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="pb__band"><div class="pb__disp"><span id="pct">0</span><small>%</small></div></div>
    <div class="pb__ports" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

<script>
(function(){
  let gone=false;                         // true, sobald die Startseite dieses Dokument übernommen hat -> hier ruht alles
  const DURATION = 5200;                 // Laden 0 -> 100 % dauert mindestens so lange (echtes Laden kann länger dauern)
  const UP = 0.9;                         // Stecker: Powerbank-Grundmaß-px je Stecker-Einheit u (Gehäuse 12u = 10.8, passt zur Buchse)
  const PL = 35.6, CABU = 5.2;            // Steckerlänge (Kabelende bis Spitze) und Kabeldicke in u (Hals 6u)
  const PHONE = !!window.NIH_PHONE;      // Handy (js/device.js): kleinere Powerbank, Buttons fast bildschirmbreit
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id)=>document.getElementById(id);
  const pb=$('pb'), pct=$('pct'), enter=$('enter'), fx=$('fx'), ctx=fx.getContext('2d');
  const paths=[...$('cabPath').querySelectorAll('.c0, .c1')], braidEl=$('braid'), plugTop=$('plugTop'), plugEnd=$('plugEnd');
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

  // ---------- Geometrie ----------
  let W=0, H=0, PBS=1.875, SU=1.69, Lc=1, P0=[0,0], braid=[], braidN=-1;
  function layout(){
    W=innerWidth; H=innerHeight; const dpr=Math.min(devicePixelRatio||1,2);
    fx.width=Math.round(W*dpr); fx.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    // Powerbank 50 % größer als zuvor (1.25 -> 1.875, Handy 0.9 -> 1.35), höchstens 30 % der Bildschirmhöhe; mittig im oberen Drittel
    PBS=Math.min(PHONE ? 1.35 : 1.875, H*0.30/137); SU=UP*PBS;   // SU: Bildschirm-px je Stecker-Einheit u
    pb.style.setProperty('--pbs', PBS.toFixed(3));
    const pbW=84*PBS, pbH=137*PBS, px=(W-pbW)/2, py=Math.max(16, H*0.22-pbH/2);
    pb.style.left=px+'px'; pb.style.top=py+'px';
    // Buttons: größer, mittig, weiter unten (Mitte bei 74 % der Höhe)
    const ew = PHONE ? Math.min(W-32, 420) : cl(W*0.34, 380, 520);
    enter.style.fontSize = (PHONE ? 13 : cl(W*0.0105, 14, 17)).toFixed(1)+'px';
    enter.style.width=ew+'px'; enter.style.left=((W-ew)/2)+'px';
    enter.style.top=(H*0.74 - (enter.offsetHeight||60)/2)+'px';
    // Kabel: beginnt am Hals des oberen Steckers (Grundmaße: x 20.8 = Mitte der sichtbaren USB-C-Öffnung, y 165.8) und läuft als weiche S-Kurve senkrecht hinunter;
    // unten endet es am Hals des unteren Steckers, dessen Metallhülse 2u über der Button-Oberkante sichtbar ist (Rest steckt drin)
    plugTop.setAttribute('transform',`translate(${px.toFixed(1)} ${py.toFixed(1)}) scale(${PBS.toFixed(3)})`);
    P0=[px+20.8*PBS, py+165.8*PBS];
    const top=parseFloat(enter.style.top), Qc=[W/2, top+(7.6-2)*SU-PL*SU], drop=Qc[1]-P0[1];
    const d=`M${P0[0].toFixed(1)} ${P0[1].toFixed(1)} C${P0[0].toFixed(1)} ${(P0[1]+drop*0.5).toFixed(1)} ${Qc[0].toFixed(1)} ${(Qc[1]-drop*0.5).toFixed(1)} ${Qc[0].toFixed(1)} ${Qc[1].toFixed(1)}`;
    const CW=CABU*SU;                                                  // Kabeldicke in px
    paths.forEach((p,i)=>{ p.setAttribute('d',d); p.style.strokeWidth=(i ? CW*0.14 : CW).toFixed(2)+'px';
      if(i) p.style.transform=`translate(${(-CW*0.2).toFixed(2)}px,0)`; });
    Lc=paths[0].getTotalLength();
    // Flechtmuster: kurze schräge Striche quer übers Kabel, abwechselnd / und \ (Zickzack wie geflochten)
    braid=[]; braidN=-1; const pitch=Math.max(2.2, CW*0.3), hw=CW*0.4, ht=pitch*0.45;
    for(let s=pitch*0.5; s<Lc-0.5; s+=pitch){
      const a=paths[0].getPointAtLength(s), b=paths[0].getPointAtLength(Math.min(Lc, s+0.5));
      let tx=b.x-a.x, ty=b.y-a.y; const l=Math.hypot(tx,ty)||1; tx/=l; ty/=l;
      const nx=-ty, ny=tx, sg=braid.length%2 ? 1 : -1;
      braid.push({ s, d:`M${(a.x+nx*hw-tx*ht*sg).toFixed(1)} ${(a.y+ny*hw-ty*ht*sg).toFixed(1)}L${(a.x-nx*hw+tx*ht*sg).toFixed(1)} ${(a.y-ny*hw+ty*ht*sg).toFixed(1)}` });
    }
  }

  // ---------- Kabel wächst mit dem Ladestand (k = 0..1), Stecker an der Spitze ----------
  let shownK=0;
  function drawCable(k){
    const c=Lc*k;
    paths.forEach(p=>{ p.style.strokeDasharray=Lc.toFixed(1); p.style.strokeDashoffset=(Lc-c).toFixed(1); });
    let n=0; while(n<braid.length && braid[n].s<=c-1) n++;           // Flechtmuster nur so weit, wie das Kabel schon da ist
    if(n!==braidN){ braidN=n; braidEl.setAttribute('d', braid.slice(0,n).map(b=>b.d).join('') || 'M0 0'); }
    plugTop.style.opacity = k>0 ? '1' : '0';
    if(c<3){ plugEnd.style.opacity='0'; return; }
    const a=paths[0].getPointAtLength(c), b=paths[0].getPointAtLength(Math.max(0,c-2));
    const ang=Math.atan2(a.y-b.y, a.x-b.x)*180/Math.PI - 90;      // Steckerspitze zeigt in Wachstumsrichtung
    // Ursprung des Steckers (Hals) sitzt auf der Kabelspitze, der Stecker ragt in Wachstumsrichtung weiter
    plugEnd.setAttribute('transform',`translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${ang.toFixed(2)}) scale(${SU.toFixed(3)})`);
    plugEnd.style.opacity='1';
  }

  // ---------- Feuerwerk (schwarz) rund um die Buttons: kurze Raketen nach außen, zerplatzen schnell; nur AUSSERHALB der Buttons ----------
  const parts=[], rockets=[]; let fwEnd=0, lastT=0, hole=null;
  function burst(x,y){
    const n=PHONE?30:42, spd=PHONE?3.2:4.4, now=performance.now();   // schneller Knall: hohe Startgeschwindigkeit, kurzes Leben
    for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2+Math.random()*0.18, v=spd*(0.55+Math.random()*0.45);
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:now,s:1.3+Math.random()*1.1,gl:Math.random()<0.3,
                  ph:Math.random()*6.3, fall:0.85+Math.random()*0.5,            // fall = Sinkgeschwindigkeit (px/Bild)
                  land:0, glide:450+Math.random()*450, burn:600+Math.random()*500}); }   // am Boden: ausgleiten, dann verglühen
  }
  function fireworks(){
    // Rundherum um die Buttons (oben, unten, seitlich, Ecken): kurze, schnelle Raketen vom Button-Rand nach außen,
    // die rasch zerplatzen
    const r=enter.getBoundingClientRect(), h=r.height, w=r.width, cx=r.left+w/2, cy=r.top+h/2, now=performance.now();
    hole=[r.left-3, r.top-3, w+6, h+6];                              // Buttons + 3 px bleiben frei
    const rx=w/2+Math.max(46, h*0.9), ry=h/2+Math.max(46, h*0.9), n=PHONE?7:9;
    for(let i=0;i<n;i++){
      const a=-Math.PI/2 + i*2*Math.PI/n + (Math.random()-0.5)*0.35;
      const ex=cx+Math.cos(a)*rx*(0.95+Math.random()*0.15), ey=cy+Math.sin(a)*ry*(0.95+Math.random()*0.25);
      const sx0=cx+Math.cos(a)*(w/2+4), sy0=cy+Math.sin(a)*(h/2+4);   // Start knapp außerhalb des Buttons
      rockets.push({ x0:sx0, y0:sy0, x1:ex, y1:ey, t:now+i*70+Math.random()*50, dur:170+Math.random()*80 });
    }
    fwEnd=now+n*70+1200;
  }
  function drawFx(now){
    const dt=lastT ? cl((now-lastT)/16.67,0.2,3) : 1; lastT=now;
    ctx.clearRect(0,0,W,H); if(!hole) return;
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(hole[0],hole[1],hole[2],hole[3]); ctx.clip('evenodd');
    ctx.strokeStyle=ctx.fillStyle='#000'; ctx.lineCap='round';
    for(let i=rockets.length-1;i>=0;i--){                            // Raketen: Leuchtspur nach oben, bremsen ab
      const r=rockets[i], k=(now-r.t)/r.dur; if(k<0) continue;
      if(k>=1){ burst(r.x1,r.y1); rockets.splice(i,1); continue; }
      const e=1-Math.pow(1-k,1.6), e0=1-Math.pow(1-Math.max(0,k-0.25),1.6);
      ctx.globalAlpha=0.75; ctx.lineWidth=1.6; ctx.beginPath();
      ctx.moveTo(r.x0+(r.x1-r.x0)*e0, r.y0+(r.y1-r.y0)*e0); ctx.lineTo(r.x0+(r.x1-r.x0)*e, r.y0+(r.y1-r.y0)*e); ctx.stroke();
    }
    const floor=H-2.5;
    for(let i=parts.length-1;i>=0;i--){                              // Funken: schneller Knall, dann sinken sie (leicht pendelnd)
      const p=parts[i], a=now-p.born; let k, fl=1;                    // zu Boden, gleiten dort aus und verglühen erst dann
      if(!p.land){
        const drag=Math.pow(0.93,dt); p.vx*=drag; p.vy=p.vy*drag+p.fall*(1-0.93)*dt;   // Endtempo nach unten = fall
        p.x+=(p.vx+Math.sin(a/420+p.ph)*0.22)*dt; p.y+=p.vy*dt;
        if(p.y>=floor){ p.y=floor; p.land=now; p.vx=p.vx*0.6+(Math.random()-0.5)*1.8; p.vy=0; }   // aufgekommen
        k = a<250 ? 1 : 0.6+0.4*Math.exp(-(a-250)/700);              // nach dem Knall etwas gedimmt
        if(p.gl && a>600 && Math.random()<0.3) fl=0.3;                // einige glitzern beim Fallen
      } else {
        const g=now-p.land; p.vx*=Math.pow(0.965,dt); p.x+=p.vx*dt;   // gleitet über den Boden aus
        const b=cl((g-p.glide)/p.burn,0,1); if(b>=1 || a>16000){ parts.splice(i,1); continue; }
        k=0.6*(1-b*b); if(b>0 && Math.random()<0.35) fl=0.35;        // verglüht flackernd
      }
      ctx.globalAlpha=k*0.55*fl; ctx.lineWidth=p.s; ctx.beginPath(); ctx.moveTo(p.x-p.vx*4.5, p.y-p.vy*4.5); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.globalAlpha=k*fl; ctx.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s);
    }
    ctx.restore(); ctx.globalAlpha=1;
  }

  // ---------- Laden / Buttons ----------
  function setPct(p){ const n=Math.round(p); pct.textContent=n; pb.setAttribute('aria-valuenow',n); }
  // Ton-Wahl merken ('on'|'off', sessionStorage 'nihanzo-sound' – liest die Startseite) -> ausblenden -> Startseite (beginnt mit dem Vorhang)
  // Die Startseite wird NICHT per Seitenwechsel geöffnet, sondern in DIESES Dokument geschrieben (document.write): Browser geben Ton
  // nur in der Seite frei, in der geklickt wurde (Safari/Firefox/Handys: nach einem Seitenwechsel bliebe „mit Ton" stumm, und Scrollen
  // zählt nicht als Klick). Darum entsteht der AudioContext hier IM Klick (window.__nihAudio); die Startseite übernimmt ihn (ensureAudio).
  // Kein <iframe>: darin ruckeln/flackern fest stehende Ebenen beim Scrollen in manchen Browsern – so läuft sie als ganz normale Seite.
  let leaving=false;
  function unlockAudio(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext, c=window.__nihAudio=new AC();
      c.resume();
      const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);   // stiller Anstoß (iOS)
    }catch(_){}
  }
  async function openStart(){
    let html=null; try{ html=await (window.__load && window.__load.html); }catch(_){}
    if(typeof html!=='string' || html.indexOf('</html>')<0){ location.assign(NIH_PAGE); return; }   // Notfall: klassischer Seitenwechsel
    gone=true;
    document.open(); document.write(html); document.close();
    // Sicherheitsnetz: feuert ein Browser nach dem Schreiben kein neues „load", wird es nachgeholt (die Startseite misst darin)
    let fired=false; addEventListener('load',()=>{ fired=true; },{once:true});
    const chk=setInterval(()=>{
      if(fired){ clearInterval(chk); return; }
      if(document.readyState==='complete'){ clearInterval(chk); setTimeout(()=>{ if(!fired) dispatchEvent(new Event('load')); }, 400); }
    }, 200);
  }
  enter.addEventListener('click',(e)=>{
    const b=e.target.closest('button'); if(!b || leaving || !enter.classList.contains('ready')) return; leaving=true;
    try{ sessionStorage.setItem('nihanzo-sound', b.dataset.sound); }catch(_){}
    window.__nihSound=b.dataset.sound;               // frische Wahl für die Startseite (gilt dort vor ?mute, s. startpage.html)
    if(b.dataset.sound==='on') unlockAudio();
    // Mauslage an die Startseite weitergeben: ihre springende Figur beginnt dort, wo der Zeiger steht (nicht in der Mitte)
    window.__nihMouse={x:e.clientX,y:e.clientY};
    addEventListener('mousemove',(ev)=>{ window.__nihMouse={x:ev.clientX,y:ev.clientY}; });
    document.body.style.transition='opacity .8s ease'; document.body.style.opacity='0';
    setTimeout(openStart, 800);
  });

  // ---------- Ablauf ----------
  let t0=0, plugged=false;
  function frame(now){
    if(gone) return;                                  // Startseite ist offen -> Ladeseite ruht
    // Fortschritt = langsamerer von Ladeanimation (Zeit) und echtem Laden der Startseite (window.__load, s. u.)
    const ld=window.__load||{p:1,done:true}, t=now-t0, base=Math.min(cl(t/DURATION,0,1), ld.done ? 1 : Math.min(0.995, ld.p));
    setPct(base<1 ? Math.min(99, base*100+Math.random()*1.2) : 100);
    const dt=Math.min(now-(frame.t||now), 500); frame.t=now;          // zeitbasiert: holt auch bei wenigen Bildern/s in ~0.3 s auf
    shownK = reduce ? base : Math.max(shownK, shownK+(base-shownK)*(1-Math.exp(-dt/90)));   // Kabel wächst weich und nie zurück
    if(base>=1 && shownK>0.997) shownK=1;
    drawCable(shownK);
    if(shownK>=1 && !plugged){                         // angekommen: Buttons werden aktiv, Feuerwerk
      plugged=true; pb.classList.remove('charging'); enter.classList.add('ready'); if(!reduce) fireworks();
    }
    drawFx(now);
    if(!(plugged && parts.length===0 && rockets.length===0 && now>fwEnd)) requestAnimationFrame(frame);
  }
  layout(); drawCable(0);
  // Start erst, wenn die Schrift geladen ist (spätestens nach 0.8 s): dann neu auslegen (Knopfhöhe hängt an der Schrift),
  // einblenden und die Ladezeit ab jetzt zählen -> das Kabel beginnt bei 0, statt nach den ersten (oft stockenden) Bildern zu springen
  let started=false;
  function start(){
    if(started || gone) return; started=true;
    layout(); drawCable(0);
    // zwei Bilder warten: der unsichtbare Zustand ist sicher gemalt -> das Einblenden läuft immer weich (auch bei Schrift aus dem Cache)
    requestAnimationFrame(()=>requestAnimationFrame((now)=>{ t0=now; document.body.classList.remove('boot'); frame(now); }));
  }
  if(document.fonts && document.fonts.load) document.fonts.load('800 16px "Nihanzo Grotesk"').then(start, start); else start();
  setTimeout(start, 800);
  addEventListener('resize',()=>{ if(gone) return; layout(); drawCable(shownK); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(gone) return; layout(); drawCable(shownK); });
})();
</script>
<script>
  /* Die Ladeseite LÄDT die Startseite wirklich vor (in den Browser-Cache – GitHub Pages: max-age, lokal: no-cache -> 304):
     1) sie liest die passende Startseite (NIH_PAGE: startpage.html bzw. auf Handys startpage-mobile.html) und sammelt automatisch alle dort genannten Dateien (assets/…, inkl. ?v=; ohne Rohmaterial
        assets/raw und die ?bg=-Varianten) -> keine Liste von Hand pflegen; Grünkohl zuerst (erstes Bild des Vorhangs)
     2) der Fortschrittsbalken zeigt den echten Stand (Bytes, window.__load.p); die Knöpfe kommen erst, wenn alles da ist
        (und frühestens nach der Ladeanimation, siehe frame())
     3) danach im Hintergrund, ohne den Balken aufzuhalten: 3D-Szenen (three.js, Module, Modell + deren Texturen)
     Erst nach dem eigenen load, damit die Ladeseite selbst nicht gebremst wird. */
  (function preloadStartpage(){
    const L = window.__load = { p:0, done:false };
    const RX = /assets\/[\w\-./]+?\.(?:webp|png|jpe?g|gif|svg|mp4|m4a|mp3|glb|ttf|woff2)(?:\?v=\d+)?/g;
    const SKIP = /assets\/raw\/|bg-(?:kugeln|glas-grau|glas-sepia|senf)\./;
    const MODS = ['js/vendor/three/three.module.js', 'js/glass.js', 'js/heart.js', 'js/vendor/three/GLTFLoader.js',
                  'js/vendor/utils/BufferGeometryUtils.js'];
    const files = [];
    const update = ()=>{ let got = 0, want = 0;
      for(const f of files){ const w = f.len || 150000; want += w; got += f.done ? w : Math.min(f.got, w); }
      L.p = want ? got/want : 1; };
    async function get(url, f){                          // lädt komplett (Stream bis zum Ende -> im Cache), zählt Bytes
      try{
        // Seiten und Skripte immer beim Server nachfragen (ETag -> 304, wenn unverändert): sonst schreibt die Ladeseite nach einem
        // Deploy bis zu 10 min (GitHub Pages: max-age=600) die ALTE Startseite aus dem Browser-Zwischenspeicher ins Dokument
        const fresh = /\.(?:html|js|css)(?:\?|$)/.test(url);
        const r = await fetch(url, fresh ? { cache:'no-cache' } : undefined); if(f) f.len = +r.headers.get('content-length') || 0;
        if(f && r.body){ const rd = r.body.getReader(); for(;;){ const { done, value } = await rd.read(); if(done) break; f.got += value.length; update(); } }
        else return await r.text();
      }catch(_){}
    }
    const scan = (txt)=>[...new Set(txt.match(RX) || [])].filter((u)=>!SKIP.test(u));
    addEventListener('load', async ()=>{
      const finish = ()=>{ L.p = 1; L.done = true; };
      setTimeout(finish, 90000);                         // Notbremse: hängt etwas, kommt man trotzdem rein
      const html = await (L.html = get(NIH_PAGE));       // Text der Startseite – openStart() schreibt ihn später in dieses Dokument
      const urls = html ? scan(html).sort((a, b)=>(b.indexOf('kale') >= 0) - (a.indexOf('kale') >= 0)) : [];
      await Promise.all(urls.map((u)=>{ const f = { got:0, len:0, done:false }; files.push(f);
        return get(u, f).then(()=>{ f.done = true; update(); }); }));
      finish();
      // Hintergrund: 3D-Module + was sie laden (Modell, Texturen)
      const mods = await Promise.all(MODS.map((m)=>get(m)));
      const seen = new Set(urls);
      await Promise.all(mods.flatMap((t, k)=>t && MODS[k].indexOf('vendor') < 0 ? scan(t) : [])   // Fremdcode nur laden, nicht durchsuchen
        .filter((u)=>!seen.has(u) && seen.add(u))
        .map((u)=>get(u, { got:0, len:0, done:false })));
    });
  })();
</script>
